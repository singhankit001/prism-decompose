name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      # The whole point of the optional-backend design is that it works with
      # nothing downloaded. Prove it on every push.
      - name: Run test suite on the weights-free path
        env:
          LAYERFORGE_CLASSICAL: "1"
        run: python -m pytest tests/ -q

      - name: Decompose a sample end to end
        run: |
          python cli.py samples/wellness.png -o /tmp/ci --quiet
          python - <<'PY'
          import json
          m = json.load(open('/tmp/ci/wellness/manifest.json'))
          print(f"{m['layer_count']} layers, PSNR {m['quality']['psnr_db']} dB")
          assert m['layer_count'] >= 3, "too few layers"
          assert m['quality']['psnr_db'] > 20, "weak reconstruction"
          cov = sum(l['coverage'] for l in m['layers'] if l['kind'] != 'background')
          assert cov <= 1.02, f"layers overlap: coverage sums to {cov:.2f}"
          print("integrity checks passed")
          PY
